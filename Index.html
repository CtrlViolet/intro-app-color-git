<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector de Color RGB</title>
    <link rel="stylesheet" href="./Css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container text-center ">
        <nav class="navbar navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Aplicación de pruebas de color</a>
               <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    </ul>
                </div>
            </div>
        </nav>
        <h1 class="title">Selector de Color RGB con test</h1>

        <div class="glass-container">
            <!-- Selector de Color -->
            <label for="colorPicker" class="form-label">Selecciona un color</label>
            <input type="color" id="colorPicker" class="form-control form-control-color mb-3" value="#000000">

            <div class="row justify-content-center">
                <div class="col-md-6">
                    <!-- Rojo -->
                    <label for="rojo" class="form-label">Rojo</label>
                    <div class="input-group mb-2">
                        <input type="number" class="form-control" id="rojoInput" min="0" max="255" value="0">
                        <input type="range" class="form-range" id="rojo" min="0" max="255" value="0">
                    </div>

                    <!-- Verde -->
                    <label for="verde" class="form-label">Verde</label>
                    <div class="input-group mb-2">
                        <input type="number" class="form-control" id="verdeInput" min="0" max="255" value="0">
                        <input type="range" class="form-range" id="verde" min="0" max="255" value="0">
                    </div>

                    <!-- Azul -->
                    <label for="azul" class="form-label">Azul</label>
                    <div class="input-group mb-2">
                        <input type="number" class="form-control" id="azulInput" min="0" max="255" value="0">
                        <input type="range" class="form-range" id="azul" min="0" max="255" value="0">
                    </div>
                </div>
            </div>
            
            <div class="color-box mt-4" id="colorBox"></div>
            <p class="mt-2">Código Hex: <span id="hexCode">#000000</span></p>
        </div>
        <footer class="bg-dark text-light text-center py-3 mt-auto">
            <div class="container">
                <p class="mb-0">&copy; 2025 Miguel Ángel. Todos los derechos reservados.</p>
            </div>
        </footer>
    </div>
    
    <script src="./Js/script.js"></script>
</body>

</html>
